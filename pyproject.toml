[project]
name = "minimal-software-factory"
version = "0.1.0"
description = "A minimal OpenCode software factory orchestrated through Herdr"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
include = ["factory", "software_factory/**/*.py", "tests/**/*.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["software_factory", "tests"]
