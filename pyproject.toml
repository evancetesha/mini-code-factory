[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-software-factory"
dynamic = ["version"]
description = "A minimal OpenCode software factory orchestrated through Herdr"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20,<5",
    "typer>=0.21,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "software_factory.__version__" }

[tool.ruff]
include = ["factory", "software_factory/**/*.py", "tests/**/*.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["software_factory", "tests"]
